schema_version: 1

context:
  name: molecular-rectifier
  version: 1.0.1

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/molecular_rectifier-${{ version }}.tar.gz
  sha256: 76ac7cdbee8ade1e7acb89b373ba55ccc9b8b07bb8e1fadc5239f59ef77d941f

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - rdkit

tests:
  - python:
      imports:
        - molecular_rectifier
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: Given an RDKit molecule that does not sanitise, correct it until it does, regardless of the severity of the change.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/matteoferla/molecular_rectifier

extra:
  recipe-maintainers:
    - jan-janssen
